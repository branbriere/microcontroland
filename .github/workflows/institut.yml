# Microcontrôland : page « Institut national de sondage » / « National Polling Institute ».
# Après chaque édition, lit le fichier brut du soir dans le dépôt public microcontroland-data (les 120 citoyens),
# ajoute le soir à institut.json (jamais réécrit) et régénère institut.html et en/institut.html. La passerelle ne change pas.
# Le fichier brut part juste après le journal : l'action l'attend jusqu'à 15 minutes, puis repasse à heure fixe.
name: Institut national de sondage

on:
  push:
    branches: [main]
    paths:
      - "data/latest.json"
      - ".github/institut.py"
  schedule:
    - cron: "50 18 * * *"   # 20 h 50 à Paris en heure d'été
    - cron: "50 19 * * *"   # 20 h 50 à Paris en heure d'hiver
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: institut
  cancel-in-progress: false

jobs:
  institut:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Compter la population du soir
        run: python3 .github/institut.py . --attendre ${{ github.event_name == 'push' && '900' || '0' }}

      - name: Déposer si quelque chose a changé
        run: |
          deposer() { for f in institut.json institut.html en/institut.html; do [ -f "$f" ] && git add "$f"; done; }
          deposer
          if git diff --cached --quiet; then
            echo "Rien de nouveau."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -q -m "Institut national de sondage (automatique)"
          # Même méthode que le correctif du 13/11/2026 : si une autre action a publié entre-temps, on repart de la
          # dernière version du site, on recompte (sans attendre) et on réessaie. Pauses de 15 à 75 s, plus un peu de hasard.
          for i in 1 2 3 4 5; do
            git push -q origin HEAD:main && echo "ok=1" >> "$GITHUB_ENV" && exit 0
            sleep $((i * 15 + RANDOM % 10))
            git fetch -q origin main
            git reset -q --hard origin/main
            python3 .github/institut.py . --attendre 0
            deposer
            if git diff --cached --quiet; then
              echo "Rien de nouveau : une autre exécution a déjà publié ces fichiers."
              exit 0
            fi
            git commit -q -m "Institut national de sondage (automatique)"
          done
          exit 1

      - name: Relancer la mise en ligne du site
        if: env.ok == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" || echo "Relance non nécessaire."

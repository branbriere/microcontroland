# Microcontrôland : « Salle de la Relique » / « Hall of the Relic » (Ambassade).
# Après chaque édition publiée par la passerelle, régénère relique.html, en/relique.html, relique.txt et en/relique.txt.
# Fermée (« en attente d'évolution de la civilisation ») tant que la Diplomatie n'est pas atteinte ; ouvre seule ensuite.
# Le problème du jour change chaque soir. La passerelle ne change pas.
name: Salle de la Relique

on:
  push:
    branches: [main]
    paths:
      - "data/latest.json"
      - "relique/**"
      - ".github/relique.py"
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: relique
  cancel-in-progress: false

jobs:
  relique:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Générer la Salle de la Relique (FR, EN, versions texte)
        run: python3 .github/relique.py .

      - name: Déposer si quelque chose a changé
        run: |
          git add relique.html en/relique.html relique.txt en/relique.txt
          if git diff --cached --quiet; then
            echo "Rien de nouveau."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -q -m "Salle de la Relique (automatique)"
          # Si une autre action a publié entre-temps : on repart de la dernière version du site, on régénère et on réessaie
          # (correctif du 14/11/2026, comme texte-journal et historique le 13/11 : après l'édition de 20 h, une douzaine
          # d'actions publient en même temps ; l'ancien « git pull --rebase » suivi de 3 essais échouait). Pauses de 15 à 75 s.
          for i in 1 2 3 4 5; do
            git push -q origin HEAD:main && echo "ok=1" >> "$GITHUB_ENV" && exit 0
            sleep $((i * 15 + RANDOM % 10))
            git fetch -q origin main
            git reset -q --hard origin/main
            python3 .github/relique.py .
            git add relique.html en/relique.html relique.txt en/relique.txt
            if git diff --cached --quiet; then
              echo "Rien de nouveau : une autre exécution a déjà publié ces fichiers."
              exit 0
            fi
            git commit -q -m "Salle de la Relique (automatique)"
          done
          exit 1

      - name: Relancer la mise en ligne du site
        if: env.ok == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" || echo "Relance non nécessaire."

# Microcontrôland : version sans JavaScript de La Puce Libre.
# Après chaque édition publiée par la passerelle, transforme data/editions/*.json
# en journal.txt, texte/ (éditions, histoire, langue) et sitemap.xml (aucun mot ajouté au journal). La passerelle ne change pas.
name: Version texte du journal

on:
  push:
    branches: [main]
    paths:
      - "data/latest.json"
      - "data/editions/**"
      - "data/histoire.json"
      - "data/langue.json"
      - ".github/texte_journal.py"
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: texte-journal
  cancel-in-progress: false

jobs:
  texte:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Générer journal.txt, texte/, decouvrir.html et sitemap.xml
        run: python3 .github/texte_journal.py .

      - name: Déposer si quelque chose a changé
        run: |
          git add journal.txt texte sitemap.xml decouvrir.html
          if git diff --cached --quiet; then
            echo "Rien de nouveau."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -q -m "Version texte du journal (automatique)"
          # Si une autre action a publié entre-temps : on repart de la dernière version du site, on régénère et on réessaie
          # (correctif du 13/11/2026 : après l'édition de 20 h, une dizaine d'actions publient en même temps ; l'ancien
          # « git pull --rebase » suivi de 3 essais échouait ces soirs-là). Pauses de 15 à 75 s, plus un peu de hasard.
          for i in 1 2 3 4 5; do
            git push -q origin HEAD:main && echo "ok=1" >> "$GITHUB_ENV" && exit 0
            sleep $((i * 15 + RANDOM % 10))
            git fetch -q origin main
            git reset -q --hard origin/main
            python3 .github/texte_journal.py .
            git add journal.txt texte sitemap.xml decouvrir.html
            if git diff --cached --quiet; then
              echo "Rien de nouveau : une autre exécution a déjà publié ces fichiers."
              exit 0
            fi
            git commit -q -m "Version texte du journal (automatique)"
          done
          exit 1

      - name: Relancer la mise en ligne du site
        if: env.ok == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" || echo "Relance non nécessaire."

# Microcontrôland : page « L'atelier » / « The Studio » (art primitif).
# Après chaque édition, lit le fichier brut du soir dans le dépôt public microcontroland-data (poids des cerveaux),
# ajoute le soir à atelier.json et régénère atelier.html et en/atelier.html. La passerelle ne change pas.
# Le fichier brut part juste après le journal : l'action l'attend jusqu'à 15 minutes, puis repasse à heure fixe.
name: Atelier

on:
  push:
    branches: [main]
    paths:
      - "data/latest.json"
      - ".github/atelier.py"
  schedule:
    - cron: "35 18 * * *"   # 20 h 35 à Paris en heure d'été
    - cron: "35 19 * * *"   # 20 h 35 à Paris en heure d'hiver
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: atelier
  cancel-in-progress: false

jobs:
  atelier:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Ajouter le soir et générer les pages
        run: python3 .github/atelier.py . --attendre ${{ github.event_name == 'push' && '900' || '0' }}

      - name: Déposer si quelque chose a changé
        run: |
          git add atelier.json atelier.html en/atelier.html
          if git diff --cached --quiet; then
            echo "Rien de nouveau."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -q -m "Atelier (automatique)"
          # Si une autre action a publié entre-temps : on repart de la dernière version du site, on régénère et on réessaie
          # (correctif du 14/11/2026, comme texte-journal et historique le 13/11 : après l'édition de 20 h, une douzaine
          # d'actions publient en même temps ; l'ancien « git pull --rebase » suivi de 3 essais échouait). Pauses de 15 à 75 s.
          for i in 1 2 3 4 5; do
            git push -q origin HEAD:main && echo "ok=1" >> "$GITHUB_ENV" && exit 0
            sleep $((i * 15 + RANDOM % 10))
            git fetch -q origin main
            git reset -q --hard origin/main
            python3 .github/atelier.py . --attendre 0
            git add atelier.json atelier.html en/atelier.html
            if git diff --cached --quiet; then
              echo "Rien de nouveau : une autre exécution a déjà publié ces fichiers."
              exit 0
            fi
            git commit -q -m "Atelier (automatique)"
          done
          exit 1

      - name: Relancer la mise en ligne du site
        if: env.ok == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" || echo "Relance non nécessaire."

# Microcontrôland : page « Les premières écritures » / « The First Writings » (glyphes 5×5).
# Après chaque édition, lit le fichier brut du soir dans le dépôt public microcontroland-data (lexiques des régions),
# ajoute le jour à ecriture.json et régénère ecriture.html et en/ecriture.html. La passerelle ne change pas.
# Le fichier brut part juste après le journal : l'action l'attend jusqu'à 15 minutes, puis repasse à heure fixe.
name: Ecriture

on:
  push:
    branches: [main]
    paths:
      - "data/latest.json"
      - ".github/ecriture.py"
      - "galerie.json"
  schedule:
    - cron: "40 18 * * *"   # 20 h 40 à Paris en heure d'été
    - cron: "40 19 * * *"   # 20 h 40 à Paris en heure d'hiver
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: ecriture
  cancel-in-progress: false

jobs:
  ecriture:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Ajouter le jour et générer les pages
        run: python3 .github/ecriture.py . --attendre ${{ github.event_name == 'push' && '900' || '0' }}

      - name: Déposer si quelque chose a changé
        run: |
          git add ecriture.json ecriture.html en/ecriture.html
          if git diff --cached --quiet; then
            echo "Rien de nouveau."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -q -m "Ecriture (automatique)"
          for i in 1 2 3; do
            git push && echo "ok=1" >> "$GITHUB_ENV" && exit 0
            sleep $((i * 10))
            git pull --rebase -q origin main
          done
          exit 1

      - name: Relancer la mise en ligne du site
        if: env.ok == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" || echo "Relance non nécessaire."

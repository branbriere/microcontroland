# Microcontrôland : historique de chaque citoyen pour la page « Mon citoyen » (data/historique.json).
# Après chaque édition, relit les fichiers bruts publiés du dépôt microcontroland-data (événements et états des citoyens)
# et régénère data/historique.json. La passerelle ne change pas.
# Le fichier brut part juste après le journal : l'action l'attend jusqu'à 15 minutes, puis repasse à heure fixe.
name: Historique des citoyens

on:
  push:
    branches: [main]
    paths:
      - "data/latest.json"
      - ".github/historique.py"
  schedule:
    - cron: "40 18 * * *"   # 20 h 40 à Paris en heure d'été
    - cron: "40 19 * * *"   # 20 h 40 à Paris en heure d'hiver
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: historique
  cancel-in-progress: false

jobs:
  historique:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Générer l'historique
        run: python3 .github/historique.py . --attendre ${{ github.event_name == 'push' && '900' || '0' }}

      - name: Déposer si quelque chose a changé
        run: |
          git add data/historique.json
          if git diff --cached --quiet; then
            echo "Rien de nouveau."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -q -m "Historique des citoyens (automatique)"
          for i in 1 2 3; do
            git push && echo "ok=1" >> "$GITHUB_ENV" && exit 0
            sleep $((i * 10))
            git pull --rebase -q origin main
          done
          exit 1

      - name: Relancer la mise en ligne du site
        if: env.ok == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" || echo "Relance non nécessaire."

# Microcontrôland : « Le Musée national » / « The National Museum » (visite 3D et visite en texte).
# Le musée est procédural : après la galerie, l'atelier et les sculptures, il relit les fichiers déjà publiés (data/latest.json,
# galerie.json, atelier.json, sculptures.json, sculptures-soir.json, ecriture.json, chant.json, institutions.json) et la liste des salles possibles (musee-catalogue.json), puis régénère musee.json,
# musee.html et en/musee.html. Aucune œuvre n'est dessinée à la main. La passerelle ne change pas.
# 1.3 (17/11/2026) : le musée devient un bunker (sept niveaux) ; relance aussi après l'écriture et le chant de la place.
name: Musee national

on:
  workflow_run:
    workflows: ["Galerie des presidents", "Atelier", "Sculptures", "Ecriture", "Chant de la place"]
    types: [completed]
  push:
    branches: [main]
    paths:
      - "musee-catalogue.json"
      - "institutions.json"
      - ".github/musee.py"
      - "musee-fenetres/**"
      - "musee-reserve/**"
      - "musee.js"
  schedule:
    - cron: "5 19 * * *"    # 21 h 05 à Paris en heure d'été (filet de sécurité)
    - cron: "5 20 * * *"    # 21 h 05 à Paris en heure d'hiver
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: musee
  cancel-in-progress: false

jobs:
  musee:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Construire le musée
        run: python3 .github/musee.py .

      - name: Déposer si quelque chose a changé
        run: |
          git add musee.json musee.html en/musee.html
          if git diff --cached --quiet; then
            echo "Rien de nouveau."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -q -m "Musée national (automatique)"
          # Si une autre action a publié entre-temps : on repart de la dernière version du site, on régénère et on réessaie
          # (correctif du 14/11/2026, comme texte-journal et historique le 13/11 : après l'édition de 20 h, une douzaine
          # d'actions publient en même temps ; l'ancien « git pull --rebase » suivi de 3 essais échouait). Pauses de 15 à 75 s.
          for i in 1 2 3 4 5; do
            git push -q origin HEAD:main && echo "ok=1" >> "$GITHUB_ENV" && exit 0
            sleep $((i * 15 + RANDOM % 10))
            git fetch -q origin main
            git reset -q --hard origin/main
            python3 .github/musee.py .
            git add musee.json musee.html en/musee.html
            if git diff --cached --quiet; then
              echo "Rien de nouveau : une autre exécution a déjà publié ces fichiers."
              exit 0
            fi
            git commit -q -m "Musée national (automatique)"
          done
          exit 1

      - name: Relancer la mise en ligne du site
        if: env.ok == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" || echo "Relance non nécessaire."
